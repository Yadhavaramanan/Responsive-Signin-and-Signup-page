<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            flex-direction: column;
            text-align: center;
        }
        
        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p {
            margin-bottom: 30px;
            color: #555;
            line-height: 1.6;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 25px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
        }
        
        .btn:hover {
            background-color: #6a3d91;
        }
        
        .btn.secondary {
            background-color: transparent;
            border: 1px solid #764ba2;
            color: #764ba2;
        }
        
        .btn.secondary:hover {
            background-color: #f5f0ff;
        }

        /* Auto redirect message */
        .redirect-message {
            color: white;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Platform</h1>
        <p>Access your account or create a new one to get started with our services.</p>
        <div class="btn-group">
            <a href="login.html" class="btn">Log In</a>
            <a href="register.html" class="btn secondary">Sign Up</a>
        </div>
    </div>
    <p class="redirect-message">Redirecting to login page in <span id="countdown">5</span> seconds...</p>

    <script>
        // Set login.html as the default page with a countdown
        let count = 5;
        const countdownElement = document.getElementById('countdown');
        
        const countdownInterval = setInterval(() => {
            count--;
            countdownElement.textContent = count;
            
            if (count <= 0) {
                clearInterval(countdownInterval);
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
